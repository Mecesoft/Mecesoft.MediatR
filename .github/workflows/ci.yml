name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Mecesoft.MediatR.sln

      - name: Build
        run: dotnet build Mecesoft.MediatR.sln --configuration Release --no-restore

      - name: Test .NET 8
        run: dotnet test tests/Mecesoft.MediatR.Tests/Mecesoft.MediatR.Tests.csproj --configuration Release --framework net8.0 --no-build --no-restore

      - name: Test .NET 10
        run: dotnet test tests/Mecesoft.MediatR.Tests/Mecesoft.MediatR.Tests.csproj --configuration Release --framework net10.0 --no-build --no-restore
